# backstage-catalog-new/groups/org-users.yaml
#
# User entities. Each user's `metadata.name` must match the
# username derived from their Google email in googleAuthModule.ts:
#   john.doe@yourcompany.com → john_doe
#   sairam@yourcompany.com   → sairam
#
# To onboard a new user:
#   1. Add a User entity here with their email annotation
#   2. Add their name to the correct Group in org-groups.yaml
#   3. Push to GitHub — Backstage auto-ingests within minutes
#   ✅ No code changes, no restart needed.
#

# ── Static admin users (4 owners) ────────────────────────────────────────────

apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: Udhayakiran       # ← must match emailToUsername('owner.one@yourcompany.com')
  namespace: default
  annotations:
    google.com/email: udhayakiran2110@gmail.com
    backstage.io/managed-by-location: url:https://github.com/sairam3333/backstage-catalog-sample3/blob/main/backstage-catalog-new/groups/org-users.yaml
spec:
  profile:
    displayName: Udhayakiran
    email: udhayakiran2110@gmail.com
  memberOf:
    - admins
    - platform

---
apiVersion: backstage.io/v1alpha1
